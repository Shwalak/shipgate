# Synthetic support tickets for a fictional project-management product ("Taskwise").
# All text is invented for this example; no real customer data is used.
#
# Labelling rubric (the "ground truth" a PM would agree with support leads):
#   category: billing | bug | how_to | account_access | feature_request
#   urgency:
#     urgent  - outage for a team, data loss or exposure, security risk, wrongly taken
#               money with a hard deadline, or a lockout with a hard deadline
#     normal  - a real problem or request with no emergency
#     low     - questions, feature ideas and cosmetic issues
#
# Tags are for slicing results (see the per-segment table in the report).

# ---------------------------------------------------------------- urgent (14)
- id: t01
  input: "Since about 9am nobody on our team of 40 can open any project. The page just spins and then shows a blank screen. We have a client delivery at noon."
  expected: {category: bug, urgency: urgent}
  tags: [outage]
- id: t02
  input: "I just noticed a charge of $2,340 on our card today and another identical one yesterday. We are on the $195 plan. Please reverse this today, our finance team is closing the books."
  expected: {category: billing, urgency: urgent}
  tags: [payment]
- id: t03
  input: "Someone logged into our admin account from a country we don't operate in and changed the billing email. Please lock the account."
  expected: {category: account_access, urgency: urgent}
  tags: [security]
- id: t04
  input: "We imported our customer list and now half of the records are gone. The backup you advertise doesn't show anything from last week either."
  expected: {category: bug, urgency: urgent}
  tags: [data-loss]
- id: t05
  input: "My API key was accidentally committed to a public repo about an hour ago. I've removed it but I need it revoked immediately."
  expected: {category: account_access, urgency: urgent}
  tags: [security]
- id: t06
  input: "I'm locked out and my board presentation starts in 30 minutes. The reset email never arrives and my phone with the 2FA app was stolen."
  expected: {category: account_access, urgency: urgent}
  tags: [lockout]
- id: t07
  input: "Our payroll export has been duplicating every employee row since yesterday's update. Payroll runs tonight."
  expected: {category: bug, urgency: urgent}
  tags: [data-loss]
- id: t08
  input: "URGENT: the checkout page on our embedded widget returns a 500 error for every customer. We're losing sales right now."
  expected: {category: bug, urgency: urgent}
  tags: [outage]
- id: t09
  input: "Your system emailed our entire client list a draft invoice meant for internal review. Several clients have already replied."
  expected: {category: bug, urgency: urgent}
  tags: [security]
- id: t10
  input: "We were charged after cancelling in March. I have the cancellation confirmation. My bank is about to dispute this tomorrow unless it's refunded."
  expected: {category: billing, urgency: urgent}
  tags: [payment]
- id: t11
  input: "The mobile app crashes on launch for every user in our company since the update this morning. Our field team can't log hours and it's month-end."
  expected: {category: bug, urgency: urgent}
  tags: [outage]
- id: t12
  input: "I think a former employee still has access. We saw them viewing confidential project files last night. Please remove their seat and tell us what they accessed."
  expected: {category: account_access, urgency: urgent}
  tags: [security]
- id: t13
  input: "Our SSO login is failing for the whole organisation with 'invalid assertion'. Nobody can sign in and we have an all-hands demo in an hour."
  expected: {category: account_access, urgency: urgent}
  tags: [outage, lockout]
- id: t14
  input: "The export to PDF has started including other customers' project names in the footer. I can see names I definitely shouldn't."
  expected: {category: bug, urgency: urgent}
  tags: [security, tricky]

