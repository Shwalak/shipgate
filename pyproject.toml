[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipgate"
version = "0.1.0"
description = "Turn a PM's acceptance criteria into evals and a SHIP / HOLD / NO-SHIP launch report for AI features."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shipgate = "shipgate.cli:main"

[tool.setuptools]
packages = ["shipgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
